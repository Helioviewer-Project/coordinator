name: coordinator

services:
  app:
    build:
      context: ../app
      args:
        FASTAPI_ENV: ${FASTAPI_ENV:-production}
    user: "${UID}:${GID}"
    volumes:
      - ../app:/home/nonroot/app
    environment:
      - FASTAPI_ENV=${FASTAPI_ENV:-production}
      - PYTHONPATH=/home/nonroot/app
      # nginx-proxy + acme-companion (Let's Encrypt) routing.
      # Values come from .env at the repo root (copy .env.example to .env).
      # Same convention as the events-api compose.
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=${VIRTUAL_PORT:-80}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    command: ["-m", "fastapi", "dev", "--host", "0.0.0.0", "--port", "80", "main.py"]
    networks:
      - nginx-proxy
    restart: unless-stopped

networks:
  nginx-proxy:
    external: true
