services:
  app:
    build: .
    user: "${UID}:${GID}"
    volumes:
      - .:/home/nonroot/app
    environment:
      - FASTAPI_ENV=${FASTAPI_ENV:-development}
      - PYTHONPATH=/home/nonroot/app
      # nginx-proxy + acme-companion (Let's Encrypt) routing.
      # Values come from app/.env (copy app/.env.example to app/.env).
      # Same convention as the events-api compose.
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=${VIRTUAL_PORT:-80}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    command: ["-m", "fastapi", "dev", "--host", "0.0.0.0", "--port", "80", "main.py"]
    networks:
      - nginx-proxy
    restart: unless-stopped

networks:
  nginx-proxy:
    external: true
